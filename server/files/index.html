<!-- template -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movies!</title>
    <link rel="stylesheet" href="index.css" />
    <script type="module" src="index.js"></script>
  </head>
<!-- template -->

  <body>
    <!-- START - Task 1.1: Semantic page structure with authentication UI -->
    <header>
      <h1>Movies!</h1>
      <!-- User greeting is rendered dynamically based on login state -->
      <div id="userGreeting" class="user-greeting"></div>
    </header>
    <nav>
      <!-- Genre filter section (hidden if not logged in) -->
      <h2>Genres</h2>
      <ul id="filter"></ul>
      <!-- Authentication and movie management buttons -->
      <h2>Manage</h2>
      <ul>
        <li>
          <!-- Button to open the search/add movies dialog (only visible if logged in) -->
          <button id="addMoviesBtn">Add movies</button>
        </li>
        <li>
          <!-- Toggles between "Login" and "Logout" based on session state -->
          <button id="authBtn">Login</button>
        </li>
      </ul>
    </nav>
    <!-- Movie cards are rendered dynamically here by index.js -->
    <main></main>
    <footer>
      <ul>
        <li>&copy; Movies!</li>
        <li>&#8213;</li>
        <li>Written by <a href="https://github.com/qwitch13">Yarah Riedl</a></li>
        <li>&#8213;</li>
        <li>
          Visit us at
          <a href="https://www.hcw.ac.at/" target="_blank">HCW Campus Vienna</a>
        </li>
      </ul>
    </footer>
    <!-- END - Task 1.1 -->

    <!-- START - Task 1.1: Modal login dialog
         Opened when user clicks the auth button. Contains form for username and password.
    -->
    <dialog id="loginDialog">
      <form id="loginForm">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <button type="submit">Login</button>
        <button type="button" id="cancelLogin">Cancel</button>
      </form>
    </dialog>
    <!-- END - Task 1.1 -->

    <!-- START - Task 2.1: Modal search dialog for adding movies from OMDb API.
         Opened when user clicks "Add movies" button. Contains search form and results area.
         IDs match the event listeners in index.js.
    -->
    <dialog id="searchDialog">
      <form id="searchForm">
        <label for="query">Suche nach einem Film:</label>
        <input type="text" id="query" name="query" required>
        <button type="submit">Suchen</button>
        <button type="button" id="cancelSearch">Abbrechen</button>
      </form>
      <!-- Search results are rendered here dynamically -->
      <div id="searchResults"></div>
    </dialog>
    <!-- END - Task 2.1 -->

  </body>
</html>
